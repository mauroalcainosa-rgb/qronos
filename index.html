*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}

.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}

.main{min-width:0;display:flex;flex-direction:column}.top{display:none}.wrap{padding:24px 30px 96px;max-width:1440px;width:100%}

.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.mt{margin-top:16px}

.mu{color:var(--mu)}.sm{font-size:.83rem}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}

.f{display:grid;gap:12px}.fl label{display:block;font-size:.8rem;font-weight:650;margin-bottom:5px}.fl .h{font-size:.76rem;color:var(--mu);margin-top:3px}
.in{width:100%;border:0;border-radius:11px;padding:9px 12px;background:var(--fill);min-height:40px}.in:focus{outline:2px solid var(--ac);background:var(--sf)}textarea.in{min-height:84px;resize:vertical}

.pab{border-radius:16px;padding:14px;background:var(--sf);box-shadow:var(--sh);position:relative;overflow:hidden}.pab::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:#34c759}

/* Riesgos de una cirugía: ítems no confirmados dentro del horizonte */
function riesgosCirugia(c,now,horizonteH=36){

/* ---------- Decisión formal sobre una tarea: verificación contra el servidor + efectos ---------- */
async function decidir(id,acc,fund,destino){
  if(!navigator.onLine){toast('Sin conexión: las validaciones exigen verificación contra el servidor.');return false}
  const vista=byId('tareas',id);const cur=await fresh('tareas',id);
  if(!cur){toast('La solicitud ya no existe.');return false}
  const pr=E.puede(S.rol,cur,acc,matriz);if(!pr.ok){toast(pr.m);return false}
  const r=E.decidir(cur,acc,{rol:S.rol,u:ak(),fund,verVista:vista?.ver,destino,now:nowMs()});
  if(r.error){toast(r.m);raw.tareas=L('tareas').map(x=>x._id===id?cur:x);sched();return false}
  const {_id,...b}=r.t;await put('tareas',id,b);
  log(`Decisión: ${b.hist.at(-1).acc}`,`${cur.folio} · ${cur.accion}`,{atrib:E.PERMS.find(p=>p[0]===({aprobar:'validar',observar:'observar',rechazar:'observar',antecedentes:'solicitar',derivar:'asignar',escalar:'escalar',alternativa:'autorizar'})[acc])?.[1],antes:{estado:cur.estado,ver:cur.ver,rol:cur.rolActual},despues:{estado:b.estado,ver:b.ver,rol:b.rolActual},motivo:fund,ref:{tipo:'tarea',id}});
  await efectos({...b,_id:id},cur);
  const txt=`${b.hist.at(-1).acc} por ${rolN(S.rol)}${fund?': «'+fund+'»':''} — ${cur.folio} (validación formal registrada).`;
  msgSis(cur.ref?.tipo==='incidencia'?'inc-'+cur.ref.id:'general',txt,{tipo:'tarea',id});
  const lvl=['observada','rechazada','escalada'].includes(b.estado)?'alta':'informativa';
  notificar(lvl,`${b.hist.at(-1).acc} · ${cur.folio}`,`${cur.accion}${fund?' — '+fund:''}`,[cur.unidadSol||'coordq','coordq',b.rolActual],{tipo:'tarea',id},null);
  toast(b.hist.at(-1).acc+' · registrado');return true;
}
async function efectos(t,antes){
  const ref=t.ref||{};
  if(t.tipo==='aseo'&&t.estado==='aprobada'){const min=Math.round((nowMs()-Date.parse(t.ts))/6e4);notificar('informativa','Pabellón listo para el siguiente paciente',`${pabN(ref.id)} · recambio de ${min} min${min>25?' (sobre la meta de 25 min)':''}`,['enfermeria','jefpab','coordq'],{tipo:'pabellones'})}
  if(ref.tipo==='cirugia'){const c=await fresh('cirugias',ref.id);const n=E.efectoCirugia(c,t);if(n){const {_id,...b}=n;b.hist=[...(c.hist||[]),{ts:new Date(nowMs()).toISOString(),acc:`Checklist · ${E.CHECK[ref.item].n}: ${n.checklist[ref.item].estado}`,u:ak(),rol:S.rol}];await put('cirugias',ref.id,b)}}
  if(ref.tipo==='cambio'&&t.estado==='aprobada'){const c=await fresh('cirugias',ref.id);if(c){const {_id,...b}=c;Object.assign(b,ref.cambio);b.ver=(c.ver||1)+1;b.hist=[...(c.hist||[]),{ts:new Date(nowMs()).toISOString(),acc:'Reprogramación aprobada',txt:ref.motivo,u:ak(),rol:S.rol}];await put('cirugias',ref.id,b);
    notificar('informativa','Programación modificada',`${c.codigo}: ${ref.cambio.fecha||c.fecha} ${ref.cambio.hIni||c.hIni} · ${byId('pabellones',ref.cambio.pabellon||c.pabellon)?.nombre}`,['coordq','enfermeria','anestesia','cirujano','camas','esterilizacion'],{tipo:'programacion'},null,['hlf_programacion'])}}
  if(ref.tipo==='liberacion'){const l=await fresh('liberaciones',ref.id);if(l){const pasos=l.pasos.map(p=>p.id===ref.paso?{...p,estado:t.estado==='aprobada'?'aprobada':t.estado==='rechazada'?'rechazada':t.estado==='observada'?'observada':p.estado,por:ak()}:p);
    const est=E.avanceLiberacion({...l,pasos});const {_id,...b}=l;await put('liberaciones',ref.id,{...b,pasos,estado:est});
    if(est==='liberado'){const pb=byId('pabellones',l.pabellon);await put('pabellones',l.pabellon,{...clean(pb),estado:'operativo',ver:(pb.ver||1)+1});notificar('informativa',`${l.pabN} liberado para uso`,'Todas las validaciones obligatorias cumplidas.',['coordq','jefpab'],{tipo:'pabellones'});msgSis('pab-'+l.pabellon,`✅ ${l.pabN} liberado: limpieza, equipamiento y condiciones clínicas validadas.`)}}}
  if(ref.tipo==='incidencia'){const i=await fresh('incidencias',ref.id);if(!i)return;const {_id,...b}=i;
    if(ref.etapa==='atender'&&t.estado==='aprobada'){b.estado='resuelta_por_verificar';b.hist=[...(i.hist||[]),{ts:new Date(nowMs()).toISOString(),acc:'Resolución informada',u:ak(),rol:S.rol}];await put('incidencias',ref.id,b);
      const vr=i.responsable==='concesionaria'?'concesion':'jefpab';const vid=`inc-${ref.id}-verif`;
      await put('tareas',vid,{folio:folio(),tipo:'verificacion',origen:'Incidencia '+i.folio,unidadSol:t.rolResp,rolResp:vr==='concesion'?'jefpab':vr,rolActual:vr==='concesion'?'jefpab':vr,accion:`Confirmar resolución de incidencia · ${i.folio}`,dominio:'operacional',prioridad:i.prioridad==='critica'?'critica':'alta',ts:new Date(nowMs()).toISOString(),plazo:new Date(nowMs()+cfg.plazoMin.alta*6e4).toISOString(),antecedentes:`${i.tipo} en ${byId('pabellones',i.pabellon)?.nombre}. Verificación en terreno requerida: un aviso por chat no cierra la incidencia.`,ref:{tipo:'incidencia',id:ref.id,etapa:'verificar'},estado:'pendiente',nivel:0,ver:1,hist:[{ts:new Date(nowMs()).toISOString(),acc:'Creada',txt:'Resolución informada; requiere verificación',u:'sistema'}]});
      notificar('alta','Verificar resolución de incidencia',i.folio+' · '+i.tipo,['jefpab'],{tipo:'tarea',id:vid})}
    if(ref.etapa==='verificar'&&t.estado==='aprobada'&&P('cerrarInc')){b.estado='cerrada';b.cierre=new Date(nowMs()).toISOString();b.hist=[...(i.hist||[]),{ts:b.cierre,acc:'Cerrada con verificación',u:ak(),rol:S.rol}];await put('incidencias',ref.id,b);
      const pb=byId('pabellones',i.pabellon);if(pb&&pb.estado==='fuera_servicio'&&i.fueraServicio){await put('pabellones',i.pabellon,{...clean(pb),estado:'por_liberar',ver:(pb.ver||1)+1});notificar('informativa',`${pb.nombre}: incidencia cerrada`,'Inicie el flujo de liberación para volver a operar.',['jefpab','coordq'],{tipo:'pabellones'})}}
    if(ref.etapa==='verificar'&&t.estado==='aprobada'&&!P('cerrarInc'))toast('Su perfil no puede cerrar incidencias: quedó verificada, pendiente de cierre.')}
  if(ref.tipo==='compromiso'&&t.estado==='aprobada'){const c=await fresh('compromisos',ref.id);if(c){const {_id,...b}=c;b.estado='cerrado';b.cierre=new Date(nowMs()).toISOString();b.hist=[...(c.hist||[]),{ts:b.cierre,acc:'Validado y cerrado',u:ak(),rol:S.rol}];await put('compromisos',ref.id,b)}}
}

const store={get(){try{return general.compartido?null:JSON.parse(sessionStorage.getItem('hlf_s')||'null')}catch(e){return null}},set(v){try{if(!general.compartido)sessionStorage.setItem('hlf_s',JSON.stringify(v))}catch(e){}},clr(){try{sessionStorage.removeItem('hlf_s')}catch(e){}}};
function entrar(s){S=s;store.set(s);lastAct=Date.now();lockMsg='';log('Inicio de sesión',`${s.nombre} · ${rolN(s.rol)}${s.modo==='demo'?' · perfil ficticio de demostración':''}`);location.hash=s.rol==='director'?'direccion':'inicio';render();motor()}
function salir(msg){if(S)log('Cierre de sesión',msg||'Manual');S=null;store.clr();lockMsg=msg||'';render()}

let hydT,renT;
function hydSched(){clearTimeout(hydT);hydT=setTimeout(()=>{if(!['config','miembros'].every(c=>loaded.has(c)))return;hydrate();booted=true;if(general.demo?.cargarSim&&(me.isOwner||isAdmin())&&!window._simLoading&&COLLS.every(x=>loaded.has(x))){window._simLoading=true;setTimeout(()=>seed().finally(()=>{window._simLoading=false}),300)}if(!S){const s=store.get();if(s&&valida(s))S={...s,nombre:rolN(s.rol)}}sched();motor()},60)}
function sched(){clearTimeout(renT);renT=setTimeout(safeRender,40)}
const busy=()=>{const a=document.activeElement;return a&&a.closest&&a.closest('form')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox'};
let pend=false;function safeRender(){if(busy()){pend=true;return}pend=false;render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pend&&!busy())safeRender()},150));
function valida(s){if(s.modo==='demo')return demoPermitido()&&DEMO.some(d=>d.id===s.persona&&d.r===s.rol);const m=byId('miembros',me.id);return (me.isOwner&&s.rol==='admin')||(m&&m.activo!==false&&(m.roles||[]).includes(s.rol))}
async function boot(){
  try{
    if(!window.claude?.use){bootErr='Abra la aplicación desde Claude para conectarla con la base de datos institucional del prototipo.';render();return}
    [DB,USER,ASSETS]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('assets')]);
    if(!DB){bootErr='No fue posible conectar con la base de datos. Inicie sesión en Claude y vuelva a abrir la aplicación.';render();return}
    try{const v=await USER?.me();me={id:v?.id||(await USER?.id?.())||null,name:v?.name||'',isOwner:!!(v?.isOwner??(await USER?.isOwner?.()))}}catch(e){}
    if(me.id)names[me.id]=me.name;
    COLLS.forEach(subscribe);
    setTimeout(()=>{if(!booted){COLLS.forEach(c=>loaded.add(c));hydSched()}},10000);
    try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
  }catch(e){bootErr='No fue posible iniciar la aplicación.';render()}
}

lastplanner(){const W=lpsData(),per=+(F('lpsPer')||W.length);const Wp=W.slice(-per);const cur=W[W.length-1],prev=W[W.length-2];const META=85;

function abrirCx(id,fromRoute){const c=byId('cirugias',id);if(!c||!veClinico())return;if(!$('#modal').hidden&&fromRoute)return;

function pedir(titulo,campos,cb){
  modal(mHead(titulo)+`<form class="f" data-f="pedir">${campos.map(c=>`<div class="fl"><label>${c.l}${c.req?' *':''}</label>${c.t==='sel'?`<select class="in" name="${c.k}">${c.o.map(([v,t])=>`<option value="${esc(v)}" ${v===c.v?'selected':''}>${esc(t)}</option>`).join('')}</select>`:c.t==='area'?`<textarea class="in" name="${c.k}" ${c.req?'required':''} placeholder="${esc(c.ph||'')}">${esc(c.v||'')}</textarea>`:`<input class="in" type="${c.t||'text'}" name="${c.k}" value="${esc(c.v||'')}" ${c.req?'required':''} ${c.t==='file'?'accept="image/*" capture="environment"':''}>`}${c.h?`<div class="h">${c.h}</div>`:''}</div>`).join('')}<div class="row"><button class="btn p">Confirmar</button><button type="button" class="btn" data-a="cerrar">Cancelar</button></div></form>`);
  window._pedirCb=cb;
}
const pacienteOK=(...t)=>{const d=t.map(E.datosPaciente).find(Boolean);if(d){toast(`Bloqueado: el texto parece contener ${d}. No registre datos identificatorios de pacientes.`);return false}return true};
async function subir(file){if(!file||!ASSETS)return null;try{const r=await ASSETS.upload(file);return r?.url||r?.src||null}catch(e){toast('No se pudo subir el archivo');return null}}

    await guardarReglas({flujoLiberacion:{modo:v.modo,pasos}});log('Modifica flujo de liberación',`${v.modo} · ${pasos.length} pasos`,{atrib:'Administrar configuraciones'});toast('Flujo guardado');return}

  if(k==='reglas'){const reglas=Object.fromEntries(Object.keys(PRIO).map(p=>[p,fd.getAll(p)]));const can=fd.getAll('canal');await guardarReglas({reglas,canales:{app:true,push:can.includes('push'),correo:can.includes('correo'),whatsapp:can.includes('whatsapp')}});log('Modifica reglas de notificación','');toast('Reglas guardadas');return}
  if(k==='indext'){const num=x=>x===''||x==null?null:+x;const d={iemaT1:num(v.iemaT1),iemaT:num(v.iemaT),lePct:num(v.lePct),p75Pct:num(v.p75Pct),menorPct:num(v.menorPct),corte:v.corte||'',por:ak(),ts:new Date().toISOString()};const ant=byId('indicadores','externos');await put('indicadores','externos',d);log('Registra indicadores externos',v.corte||'',{atrib:'Registrar',antes:ant?clean(ant):null,despues:d});toast('Indicadores guardados');return}
  if(k==='censo'){for(const s of [...SVCQ,'urpa']){const c=byId('camas',s);if(!c)continue;const n={...clean(c)};if(s==='urpa'){if(v['dot_urpa']!=='')n.dot=+v['dot_urpa']}else{if(v['ocup_'+s]!=='')n.ocup=+v['ocup_'+s];if(v['altas_'+s]!=='')n.altas=+v['altas_'+s]}await put('camas',s,n)}

  if(k==='cargos'){const fd=new FormData(f);const o={};ROLKEYS.filter(r=>r!=='admin').forEach(r=>{const t=(fd.get('t_'+r)||'').trim(),s=(fd.get('s_'+r)||'').trim(),x=(fd.get('x_'+r)||'').trim(),act=fd.get('a_'+r)==='on';if(t||s||x)o[r]={titular:t,subrogante:s,subActivo:act&&!!s,anexo:x}});

  if(k==='pabs'){for(const p of L('pabellones')){const n={...clean(p),nombre:v['n_'+p._id]||p.nombre,tipo:v['t_'+p._id]||p.tipo,ini:v['i_'+p._id]||p.ini,fin:v['f_'+p._id]||p.fin};if(stable(n)!==stable(clean(p)))await put('pabellones',p._id,n)}log('Modifica pabellones','',{atrib:'Administrar configuraciones'});toast('Pabellones guardados');return}
  if(k==='seg'){await put('config','general',{...clean(general),inactividadMin:+v.min,compartido:!!v.comp,exportRestr:!!v.exp,demoAbierto:!!v.demoA});log('Modifica seguridad',stable(v),{atrib:'Administrar configuraciones'});toast('Guardado');return}

/* ---------- Informes ---------- */
const TINF={inicio:'Resumen de inicio de jornada',intermedio:'Resumen operacional intermedio',cierre:'Informe de cierre de jornada',semanal:'Informe semanal de gestión',mensual:'Informe mensual de Dirección'};
async function generarInforme(tipo){
  const d=datos(),now=nowMs(),dia=tipo==='inicio'?hoy():hoy(),k=E.kpis(d,dia,now);
  const res=L('tareas').filter(t=>t.tipo==='checklist'&&!E.ABIERTA(t)&&t.cierre&&Date.parse(t.cierre)>now-(tipo==='mensual'?30:tipo==='semanal'?7:1)*864e5).map(t=>({id:t._id,folio:t.folio,accion:t.accion,resultado:t.estado,alternativa:t.alternativa?.txt||'',decide:rolN(t.decision?.rol),escalamientos:t.nivel||0,cierre:t.cierre,fundamento:t.decision?.fund||''}));
  const riesgos=L('cirugias').flatMap(c=>E.riesgosCirugia(c,now,48).map(r=>({codigo:c.codigo,fecha:c.fecha,hora:c.hIni,pabellon:pabN(c.pabellon),item:E.CHECK[r.item].n,prioridad:r.prioridad})));
  const cx=L('cirugias').filter(c=>c.fecha===(tipo==='inicio'?hoy():dia)).map(c=>({codigo:c.codigo,hora:c.hIni,pabellon:pabN(c.pabellon),procedimiento:c.procedimiento,estado:c.estado,causa:c.causaSusp||''}));
  const sem=E.semanas(L('produccion'),tipo==='mensual'?5:4);
  const id=uid();const titulo=`${TINF[tipo]} · ${fD(now)}`;
  await put('informes',id,{tipo,titulo,ts:new Date().toISOString(),corte:new Date(now).toISOString(),fuente:'Base de datos de Qronos · Coordinación de pabellones HLF (prototipo con datos ficticios)',por:ak(),porRol:S.rol,estado:'borrador',
    datos:{kpis:k,resueltos:res,riesgos,cirugias:cx,semanas:sem,incidencias:L('incidencias').filter(i=>i.estado!=='cerrada').map(i=>({folio:i.folio,tipo:i.tipo,pabellon:pabN(i.pabellon),responsable:i.responsable,estado:i.estado})),
      compromisos:L('compromisos').map(c=>({titulo:c.titulo,responsable:rolN(c.rol),plazo:c.plazo,avance:c.avance||0,estado:c.estado==='cerrado'?'cerrado':Date.parse(c.plazo)<now?'vencido':c.estado}))}});
  log('Genera informe',titulo,{atrib:'Emitir informes',ref:{tipo:'informe',id}});location.hash='informes';setTimeout(()=>verInforme(id),200);
}
function verInforme(id){const i=byId('informes',id);if(!i)return;const d=i.datos||{},k=d.kpis||{};
  const tb=(rows,cols)=>rows?.length?`<div class="ts"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="sm">${esc(c[2]?c[2](r[c[0]]):r[c[0]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="mu sm">Sin registros.</p>';
  const puedeVal=['director','subop','jefpab'].includes(S.rol)&&i.porRol!==S.rol||S.rol==='director';
  modal(mHead(esc(i.titulo))+`<p class="sm"><b>Fecha de corte:</b> ${fDT(i.corte)} · <b>Fuente:</b> ${esc(i.fuente)}<br><b>Responsable:</b> ${esc(actorN(i.por))} (${esc(rolN(i.porRol))}) · <b>Estado de validación:</b> ${chip(i.estado,i.estado==='borrador'?'wa':'ok')}${i.validadoPor?` por ${esc(actorN(i.validadoPor))}`:''}</p>
  <div class="kpis">${kpi('Programadas',k.programadas)}${kpi('Realizadas',k.realizadas)}${kpi('Suspendidas',k.suspendidas)}${kpi('Utilización',pct(k.utilizacion))}${kpi('Improductivo',Math.round((k.improductivoMin||0)/60*10)/10+' h')}${kpi('Pabellones fuera de servicio',k.pabFuera)}${kpi('Solicitudes vencidas',k.vencidas)}${kpi('Riesgos mañana',k.riesgosManana)}</div>
  <h3>Riesgos resueltos y decisiones registradas</h3>${tb(d.resueltos,[['folio','Folio'],['accion','Materia'],['resultado','Resultado'],['alternativa','Alternativa'],['decide','Decide'],['escalamientos','Escal.'],['fundamento','Fundamento']])}
  <h3>Riesgos vigentes (48 h)</h3>${tb(d.riesgos,[['codigo','Cirugía'],['fecha','Fecha',fD],['hora','Hora'],['pabellon','Pabellón'],['item','Condición'],['prioridad','Prioridad']])}
  <h3>Programación del día</h3>${tb(d.cirugias,[['hora','Hora'],['codigo','Código'],['procedimiento','Intervención'],['pabellon','Pabellón'],['estado','Estado'],['causa','Causa']])}
  <h3>Incidencias abiertas</h3>${tb(d.incidencias,[['folio','Folio'],['tipo','Tipo'],['pabellon','Pabellón'],['responsable','Responsable'],['estado','Estado']])}
  <h3>Compromisos</h3>${tb(d.compromisos,[['titulo','Compromiso'],['responsable','Responsable'],['plazo','Plazo',fD],['avance','Avance %'],['estado','Estado']])}
  ${['semanal','mensual'].includes(i.tipo)?`<h3>Tendencia</h3>${tb(d.semanas,[['sem','Semana',fD],['prog','Programadas'],['real','Realizadas'],['susp','Suspendidas'],['util','Utilización',v=>pct(v)]])}`:''}
  <div class="acts noprint" style="margin-top:12px">${i.estado==='borrador'&&puedeVal?`<button class="btn ok" data-a="valInf" data-id="${id}">Validar información</button>`:''}${i.estado==='validado'&&P('informes')?`<button class="btn p" data-a="disInf" data-id="${id}">Distribuir</button>`:''}
  <button class="btn" data-a="xlsInf" data-id="${id}">Excel</button><button class="btn" data-a="pdfInf" data-id="${id}">PDF</button></div>`)}
async function descargar(nombre,data,mime){try{const d=await claude.use('downloads');if(!d){toast('Esta vista no permite descargar archivos');return}await d.save({filename:nombre,data:new Blob([data],{type:mime})})}catch(e){if(e?.code!=='cancelled')toast('No se pudo descargar')}}
async function xlsx(nombre,hojas){const wb=new MiniXLSX.Workbook();hojas.forEach(([n,cols,rows])=>{const ws=wb.addWorksheet(n);ws.columns=cols.map(()=>({width:22}));cols.forEach((c,j)=>{const x=ws.getCell(1,j+1);x.value=c;x.font={bold:true,color:{argb:'FFFFFFFF'}};x.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0B5CAD'}}});rows.forEach((r,i)=>r.forEach((v,j)=>ws.getCell(i+2,j+1).value=v))});
  const buf=await wb.xlsx.writeBuffer();await descargar(nombre,buf,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')}
function exportInforme(id){const i=byId('informes',id),d=i.datos||{},k=d.kpis||{};log('Exporta informe a Excel',i.titulo,{atrib:'Emitir informes'});
  xlsx(`HLF_${i.tipo}_${isoD(i.corte)}.xlsx`,[['Resumen',['Campo','Valor'],[['Informe',i.titulo],['Fecha de corte',fDT(i.corte)],['Fuente',i.fuente],['Responsable',actorN(i.por)],['Estado de validación',i.estado],...Object.entries(k).filter(([,v])=>typeof v!=='object').map(([a,v])=>[a,typeof v==='number'?Math.round(v*10)/10:v])]],
   ['Decisiones',['Folio','Materia','Resultado','Alternativa','Decide','Escalamientos','Fundamento','Cierre'],(d.resueltos||[]).map(r=>[r.folio,r.accion,r.resultado,r.alternativa,r.decide,r.escalamientos,r.fundamento,fDT(r.cierre)])],
   ['Riesgos',['Cirugía','Fecha','Hora','Pabellón','Condición','Prioridad'],(d.riesgos||[]).map(r=>[r.codigo,r.fecha,r.hora,r.pabellon,r.item,r.prioridad])],
   ['Programación',['Hora','Código','Intervención','Pabellón','Estado','Causa'],(d.cirugias||[]).map(r=>[r.hora,r.codigo,r.procedimiento,r.pabellon,r.estado,r.causa])],
   ['Compromisos',['Compromiso','Responsable','Plazo','Avance %','Estado'],(d.compromisos||[]).map(r=>[r.titulo,r.responsable,fD(r.plazo),r.avance,r.estado])]])}

  tab('Riesgos resueltos y decisiones',['Folio','Materia','Resultado','Alternativa','Decide','Fundamento'],(d.resueltos||[]).map(r=>[r.folio,r.accion,r.resultado,r.alternativa,r.decide,r.fundamento]));

  tab('Programación',['Hora','Código','Intervención','Pabellón','Estado','Causa'],(d.cirugias||[]).map(r=>[r.hora,r.codigo,r.procedimiento,r.pabellon,r.estado,r.causa]));
  tab('Incidencias abiertas',['Folio','Tipo','Pabellón','Responsable','Estado'],(d.incidencias||[]).map(r=>[r.folio,r.tipo,r.pabellon,r.responsable,r.estado]));
  tab('Compromisos',['Compromiso','Responsable','Plazo','Avance %','Estado'],(d.compromisos||[]).map(r=>[r.titulo,r.responsable,fD(r.plazo),r.avance,r.estado]));
  log('Exporta informe a PDF',i.titulo,{atrib:'Emitir informes'});await descargar(`HLF_${i.tipo}_${isoD(i.corte)}.pdf`,doc.output('arraybuffer'),'application/pdf')}

  try{const t1=performance.now();await new Promise((res,rej)=>{let un;const to=setTimeout(()=>rej(new Error('sin eco')),8000);un=DB.collection('tareas').onSnapshot(s=>{if(s.docs.some(d=>d.id===id&&d.data().ver===3)){clearTimeout(to);try{un?.()}catch(x){}res()}});DB.doc('tareas/'+id).update?DB.doc('tareas/'+id).update({ver:3}):DB.doc('tareas/'+id).set({accion:'Prueba',ver:3})});ok('Sincronización en tiempo real (eco de suscripción)',true,Math.round(performance.now()-t1)+' ms')}catch(e){ok('Sincronización en tiempo real',false,e.message)}
  try{await DB.doc('tareas/'+id).delete();ok('Eliminación del documento de prueba',!(await fresh('tareas',id)))}catch(e){ok('Eliminación',false,e.message)}
  window._pbd=`<h2>Prueba de base de datos</h2><table><tbody>${out.join('')}</tbody></table>`;$('#pbd').innerHTML=window._pbd;log('Ejecuta pruebas de base de datos',out.length+' pruebas')}
